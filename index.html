<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mis hábitos</title>
  <style>
    body{max-width:600px;margin:32px auto;padding:0 16px;background:#17151b;color:#f5f2f5;font:16px Arial,sans-serif}
    main{padding:20px;background:#24212a;border:1px solid #45404b;border-radius:10px}
    h1,h2{color:#eee9f1}form{display:grid;gap:10px}
    input,textarea,select,button{box-sizing:border-box;padding:10px;border:1px solid #625965;border-radius:6px;font:inherit}
    input,textarea,select{width:100%;background:#17151b;color:#f5f2f5}input[type=checkbox]{width:auto}
    button{width:fit-content;background:#c83d52;color:white;cursor:pointer}nav{margin-bottom:14px}nav a{margin-right:14px;color:#f5f2f5}
    pre{overflow:auto;padding:12px;background:#17151b;color:#eee9f1}#error-nombre,#error-registro{color:#ff9daa}
  </style>
</head>
<body>
  <nav id="menu"><a href="#inicio">Inicio</a><a href="seguimiento.html" target="seguimiento">Ver seguimiento</a></nav>
  <main id="inicio">
    <h1>Mis hábitos</h1>
    <form id="formulario-habito">
      <label for="nombre">Nombre</label><input id="nombre" name="nombre" maxlength="100" required>
      <label for="descripcion">Descripción</label><textarea id="descripcion" rows="3"></textarea>
      <label for="categoria">Categoría</label><select id="categoria" required>
        <option value="">Elige categoría</option><option>Salud</option><option>Estudio</option><option>Ocio</option>
      </select>
      <button type="submit">Crear</button><p id="error-nombre" role="alert"></p>
    </form>
    <h2>Apuntar un día</h2>
    <form id="formulario-registro">
      <label for="habito-registro">Hábito</label><select id="habito-registro" required></select>
      <label for="fecha-registro">Fecha</label><input id="fecha-registro" type="date" required>
      <label for="observaciones">Observaciones</label><textarea id="observaciones" rows="3"></textarea>
      <label><input id="cumplido" type="checkbox"> Cumplido</label>
      <button type="submit">Guardar registro</button><p id="error-registro" role="alert"></p>
    </form>
    <p id="estado"></p><h2>Hábitos</h2><pre id="datos-habitos"></pre>
    <h2>Registros</h2><pre id="datos-registros"></pre><button id="borrar" type="button">Borrar cookies</button>
  </main>
  <script src="cookies.js"></script>
  <script>
    const $=id=>document.getElementById(id), formulario=$("formulario-habito"), campoNombre=$("nombre");
    const formularioRegistro=$("formulario-registro"), selectorHabito=$("habito-registro");
    const almacenado=leerCookie("habitos"), historial=leerCookie("registros");
    let habitos=Array.isArray(almacenado)?almacenado:[], registros=Array.isArray(historial)?historial:[];
    function actualizarHabitos(){selectorHabito.replaceChildren(new Option("Elige un hábito",""));habitos.forEach(h=>selectorHabito.add(new Option(h.nombre,h.id)));}
    function mostrarDatos(){
      $("datos-habitos").textContent=JSON.stringify(habitos,null,2);$("datos-registros").textContent=JSON.stringify(registros,null,2);
      $("estado").textContent=habitos.length||registros.length?"Datos recuperados.":"Sin datos guardados.";actualizarHabitos();
    }
    window.obtenerDatosSeguimiento=()=>({habitos,registros});
    window.toggleCumplido=id=>{
      const registro=registros.find(item=>item.id===id);
      if(!registro)return false;
      registro.cumplido=!registro.cumplido;guardarTodo(habitos,registros);mostrarDatos();return true;
    };
    campoNombre.addEventListener("input",()=>{campoNombre.setCustomValidity("");$("error-nombre").textContent="";});
    formulario.addEventListener("submit",e=>{
      e.preventDefault();const nombre=campoNombre.value.trim();
      if(!nombre){campoNombre.setCustomValidity("El nombre no puede estar vacío.");$("error-nombre").textContent="El nombre no puede estar vacío.";campoNombre.reportValidity();return;}
      habitos.push({id:crypto.randomUUID(),nombre,descripcion:$("descripcion").value.trim(),categoria:$("categoria").value});
      guardarTodo(habitos,registros);formulario.reset();$("error-nombre").textContent="";mostrarDatos();
    });
    formularioRegistro.addEventListener("submit",e=>{
      e.preventDefault();const fecha=$("fecha-registro").value;
      if(!selectorHabito.value||!fecha){$("error-registro").textContent="Selecciona un hábito y una fecha.";return;}
      registros.push({id:crypto.randomUUID(),habitoId:selectorHabito.value,fecha,observaciones:$("observaciones").value.trim(),cumplido:$("cumplido").checked});
      guardarTodo(habitos,registros);formularioRegistro.reset();$("error-registro").textContent="";mostrarDatos();
    });
    $("borrar").addEventListener("click",()=>{borrarCookie("habitos");borrarCookie("registros");habitos=[];registros=[];mostrarDatos();});
    mostrarDatos();
  </script>
</body>
</html>
